[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[supervisorctl]
socketfile=/var/run/supervisor.sock

[program:apache]
command=/usr/sbin/apache2ctl -D FOREGROUND
directory=/var/www/html
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/apache.err.log
stdout_logfile=/var/log/supervisor/apache.out.log
priority=100

[program:backend]
command=node src/server.js
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/backend.err.log
stdout_logfile=/var/log/supervisor/backend.out.log
priority=200

[program:vite]
command=npm run dev -- --host 0.0.0.0 --port 5173
directory=/var/www/html
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/vite.err.log
stdout_logfile=/var/log/supervisor/vite.out.log
priority=300

[program:queue]
command=php /var/www/html/artisan queue:work --verbose --tries=3 --timeout=90
directory=/var/www/html
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/queue.err.log
stdout_logfile=/var/log/supervisor/queue.out.log
priority=400

[program:cron]
command=cron -f
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/cron.err.log
stdout_logfile=/var/log/supervisor/cron.out.log
priority=500
