[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/var/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:apache]
command=/usr/sbin/apache2ctl -D FOREGROUND
directory=/var/www/html
autostart=true
autorestart=true
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
priority=100
stopasgroup=true
killasgroup=true

[program:backend]
command=node src/server.js
directory=/app
autostart=true
autorestart=true
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
priority=200
stopasgroup=true
killasgroup=true

[program:queue]
command=php /var/www/html/artisan queue:work --verbose --tries=3 --timeout=90
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
priority=300
stopasgroup=true
killasgroup=true

[program:cron]
command=cron -f
autostart=true
autorestart=true
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
priority=400
stopasgroup=true
killasgroup=true
