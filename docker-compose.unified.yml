x-backend-env: &backend-env
  PORT: 4000
  DB_HOST: postgres
  DB_PORT: 5433
  DB_NAME: webphone
  DB_USER: webphone
  DB_PASSWORD: supersecret
  JWT_SECRET: change-me
  BACKEND_INTERNAL_TOKEN: ${BACKEND_INTERNAL_TOKEN:-sync-secret}
  DEFAULT_ADMIN_EMAIL: superadmin@example.com
  DEFAULT_ADMIN_PASSWORD: 12345678
  # FREESWITCH_HOST: empty = read the host LAN IP published by host-networked FreeSWITCH
  FREESWITCH_HOST: ${FREESWITCH_HOST:-}
  FREESWITCH_HOST_IP_FILE: /mnt/gateways/.host-ip
  FREESWITCH_PORT: 8021
  FREESWITCH_PASSWORD: ClueCon
  FREESWITCH_CONNECT_TIMEOUT_MS: 5000
  FREESWITCH_RECORDINGS_PATH: /var/recordings
  FREESWITCH_GATEWAY_PATH: /mnt/gateways
  FREESWITCH_DIRECTORY_PATH: /mnt/users
  # FREESWITCH_EXTERNAL_SIP_IP: empty = advertise the detected host LAN IP
  FREESWITCH_EXTERNAL_SIP_IP: ${FREESWITCH_EXTERNAL_SIP_IP:-}
  # FREESWITCH_DIRECTORY_DOMAIN: empty = auto-detect from FreeSWITCH domain var
  FREESWITCH_DIRECTORY_DOMAIN: ${FREESWITCH_DIRECTORY_DOMAIN:-}

services:
  nginx:
    profiles:
      - prod
    image: nginx:alpine
    ports:
      - "8443:8443"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/www:/var/www/certbot
      - ./docker/nginx/letsencrypt:/etc/letsencrypt
    depends_on:
      - app
    restart: unless-stopped

  certbot:
    profiles:
      - prod
    image: certbot/certbot
    volumes:
      - ./docker/nginx/www:/var/www/certbot
      - ./docker/nginx/letsencrypt:/etc/letsencrypt
    entrypoint: ""

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: webphone
      POSTGRES_USER: webphone
      POSTGRES_PASSWORD: supersecret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webphone"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  freeswitch:
    build:
      context: ./freeswitch
      dockerfile: Dockerfile
    network_mode: host
    volumes:
      - ./freeswitch/conf:/etc/freeswitch
      - ./recordings:/var/recordings
      - freeswitch_gateways:/etc/freeswitch/gateways
      - freeswitch_users:/etc/freeswitch/directory/webphone
    environment:
      EVENT_SOCKET_PASSWORD: ClueCon
      FREESWITCH_HOST_IP_FILE: /etc/freeswitch/gateways/.host-ip
      # Empty defaults to this machine's primary IPv4 for SIP Via/Contact.
      FREESWITCH_EXTERNAL_SIP_IP: ${FREESWITCH_EXTERNAL_SIP_IP:-}
      # Empty defaults RTP/SDP to this machine's primary IPv4.
      FREESWITCH_EXTERNAL_RTP_IP: ${FREESWITCH_EXTERNAL_RTP_IP:-}
      # Backend URL for inbound.lua - FreeSWITCH uses host networking, so it
      # reaches the backend container via the host-mapped port (4000:4000)
      BACKEND_URL: http://127.0.0.1:4000
      BACKEND_INTERNAL_TOKEN: ${BACKEND_INTERNAL_TOKEN:-sync-secret}
    ulimits:
      nofile:
        soft: 32768
        hard: 32768
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.unified
    network_mode: host
    ports:
      - "18080:18080"
      - "4000:4000"
      - "5173:5173"
    env_file:
      - ./laravel/.env
      - ./backend/.env
    environment:
      <<: *backend-env
      BOOTSTRAP_DEFAULTS: "true"
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5433
      DB_DATABASE: webphone
      DB_USERNAME: webphone
      DB_PASSWORD: supersecret
      BACKEND_URL: http://127.0.0.1:4000
      BACKEND_INTERNAL_TOKEN: ${BACKEND_INTERNAL_TOKEN:-sync-secret}
      VITE_DEV_SERVER_URL: ${VITE_DEV_SERVER_URL:-http://localhost:5173}
      VITE_DEV_SERVER_PORT: ${VITE_DEV_SERVER_PORT:-5173}
    volumes:
      - ./laravel:/var/www/html
      - ./backend:/app
      - ./recordings:/var/recordings
      - freeswitch_gateways:/mnt/gateways
      - freeswitch_users:/mnt/users
      - laravel_storage:/var/www/html/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      freeswitch:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  freeswitch_gateways:
  freeswitch_users:
  laravel_storage:
