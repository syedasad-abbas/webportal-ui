x-backend-env: &backend-env
  PORT: 4000
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: webphone
  DB_USER: webphone
  DB_PASSWORD: ${DB_PASSWORD:-dev-db-password-7f3a9c2e}
  JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-4b8d1e6f}
  BACKEND_INTERNAL_TOKEN: ${BACKEND_INTERNAL_TOKEN:-dev-backend-token-9c2a7e5d}
  DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-superadmin@example.com}
  DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-dev-admin-password-8e4c1a7b}
  # FREESWITCH_HOST: empty = read the host LAN IP published by host-networked FreeSWITCH
  FREESWITCH_HOST: ${FREESWITCH_HOST:-}
  FREESWITCH_HOST_IP_FILE: /mnt/gateways/.host-ip
  FREESWITCH_PORT: 8021
  FREESWITCH_PASSWORD: ${FREESWITCH_PASSWORD:-dev-freeswitch-password-6d2b9f4a}
  FREESWITCH_CONNECT_TIMEOUT_MS: 5000
  FREESWITCH_RECORDINGS_PATH: /var/recordings
  FREESWITCH_GATEWAY_PATH: /mnt/gateways
  FREESWITCH_DIRECTORY_PATH: /mnt/users
  # FREESWITCH_EXTERNAL_SIP_IP: empty = advertise the detected host LAN IP
  FREESWITCH_EXTERNAL_SIP_IP: ${FREESWITCH_EXTERNAL_SIP_IP:-}
  # FREESWITCH_DIRECTORY_DOMAIN: empty = auto-detect from FreeSWITCH domain var
  FREESWITCH_DIRECTORY_DOMAIN: ${FREESWITCH_DIRECTORY_DOMAIN:-}

services:
  nginx:
    profiles:
      - prod
    image: nginx:alpine
    network_mode: host
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/www:/var/www/certbot
      - ./docker/nginx/letsencrypt:/etc/letsencrypt
    depends_on:
      - app
    restart: unless-stopped

  certbot:
    profiles:
      - prod
    image: certbot/certbot
    network_mode: host
    volumes:
      - ./docker/nginx/www:/var/www/certbot
      - ./docker/nginx/letsencrypt:/etc/letsencrypt
    entrypoint: ""

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: webphone
      POSTGRES_USER: webphone
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev-db-password-7f3a9c2e}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webphone -h 127.0.0.1 -p 5432"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  freeswitch:
    build:
      context: ./freeswitch
      dockerfile: Dockerfile
    network_mode: host
    volumes:
      - ./freeswitch/conf:/etc/freeswitch
      - ./recordings:/var/recordings
      - freeswitch_gateways:/etc/freeswitch/gateways
      - freeswitch_users:/etc/freeswitch/directory/webphone
    environment:
      EVENT_SOCKET_PASSWORD: ${FREESWITCH_PASSWORD:-dev-freeswitch-password-6d2b9f4a}
      FREESWITCH_HOST_IP_FILE: /etc/freeswitch/gateways/.host-ip
      # Empty defaults to this machine's primary IPv4 for SIP Via/Contact.
      FREESWITCH_EXTERNAL_SIP_IP: ${FREESWITCH_EXTERNAL_SIP_IP:-}
      # Empty defaults RTP/SDP to this machine's primary IPv4.
      FREESWITCH_EXTERNAL_RTP_IP: ${FREESWITCH_EXTERNAL_RTP_IP:-}
      # Backend URL for inbound.lua - FreeSWITCH uses host networking, so it
      # reaches the backend container via the host-mapped port (4000:4000)
      BACKEND_URL: http://127.0.0.1:4000
      BACKEND_INTERNAL_TOKEN: ${BACKEND_INTERNAL_TOKEN:-dev-backend-token-9c2a7e5d}
    ulimits:
      nofile:
        soft: 32768
        hard: 32768
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.unified
    network_mode: host
    ports:
      - "8080:8080"
      - "4000:4000"
    environment:
      <<: *backend-env
      BOOTSTRAP_DEFAULTS: "true"
      RUN_MIGRATIONS: "true"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-https://dialer.maketoplus.com:443}
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5433
      DB_DATABASE: webphone
      DB_USERNAME: webphone
      DB_PASSWORD: ${DB_PASSWORD:-dev-db-password-7f3a9c2e}
      DB_USER: webphone
      DB_NAME: webphone
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-4b8d1e6f}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-superadmin@example.com}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-dev-admin-password-8e4c1a7b}
      WEBRTC_WS: "${WEBRTC_WS:-wss://dialer.maketoplus.com/ws}"
      WEBRTC_SIP_DOMAIN: "${WEBRTC_SIP_DOMAIN:-87.99.140.75}"
      FREESWITCH_PASSWORD: ${FREESWITCH_PASSWORD:-dev-freeswitch-password-6d2b9f4a}
      APP_KEY: ${APP_KEY:-base64:7xQj4dM2vN8pL5sR1wK6cH9bF3gT0yUeA2iO4zX6nP8=}
      BACKEND_URL: http://127.0.0.1:4000
      BACKEND_INTERNAL_TOKEN: ${BACKEND_INTERNAL_TOKEN:-dev-backend-token-9c2a7e5d}
    volumes:
      - ./recordings:/var/recordings
      - freeswitch_gateways:/mnt/gateways
      - freeswitch_users:/mnt/users
      - laravel_storage:/var/www/html/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      freeswitch:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  freeswitch_gateways:
  freeswitch_users:
  laravel_storage:
